name: Build RPMs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  srpm:
    runs-on: ubuntu-latest
    container: fedora:43

    steps:
      - uses: actions/checkout@v4

      - name: Install RPM and other build tools
        run: dnf install -y rpm-build rpmdevtools git

      - name: Set up RPM build tree
        run: rpmdev-setuptree

      - name: Create source archive
        working-directory: ${{ github.workspace }}
        run: |
          VERSION="$(rpmspec -q --qf '%{version}' apt-dater-host.spec)"

          git archive \
            --prefix="apt-dater-host-${VERSION}/" \
            -o "$HOME/rpmbuild/SOURCES/apt-dater-host-${VERSION}.tar.gz" \
            HEAD

      - name: Build SRPM
        run: |
          rpmbuild -bs apt-dater-host.spec

      - name: Upload SRPM
        uses: actions/upload-artifact@v4
        with:
          name: srpm
          path: ~/rpmbuild/SRPMS/*.src.rpm

  rpm:
    needs: srpm
    runs-on: ubuntu-latest

    container:
      image: fedora:43
      options: --privileged

    strategy:
      fail-fast: false
      matrix:
        target:
          - fedora-43-x86_64
          - fedora-44-x86_64
          - fedora-45-x86_64
          - rocky-8-x86_64
          - rocky-9-x86_64
          - rocky-10-x86_64

    steps:
      - name: Install Mock
        run: dnf install -y mock

      - name: Download SRPM
        uses: actions/download-artifact@v4
        with:
          name: srpm
          path: srpm

      - name: Build RPM
        run: |
          mock \
            -r "${{ matrix.target }}" \
            --resultdir result \
            --rebuild srpm/*.src.rpm

      - name: Upload RPM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.target }}
          path: |
            result/*.rpm
            result/*.log
